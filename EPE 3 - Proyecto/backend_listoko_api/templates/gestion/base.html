<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Inventario de Bodega{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }

        /* NAVBAR */
        .navbar {
            background: #1a3a6e;
            padding: 0;
        }
        .navbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
        }
        .navbar-brand {
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
        }
        .navbar-nav {
            display: flex;
            gap: 4px;
        }
        .navbar-nav a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: background 0.15s;
        }
        .navbar-nav a:hover, .navbar-nav a.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        /* CONTENT */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 { font-size: 1.5rem; margin-bottom: 20px; color: #222; }

        /* CARDS STATS */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
        }
        .stat-card .label { font-size: 0.9rem; color: #555; margin-bottom: 6px; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: #1a3a6e; }

        /* BOTONES */
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-green { background: #2e7d32; color: #fff; }
        .btn-green:hover { background: #1b5e20; }
        .btn-dark { background: #424242; color: #fff; }
        .btn-dark:hover { background: #212121; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }

        /* TABLA */
        .table-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .table-card h3 {
            padding: 16px 20px;
            font-size: 1.1rem;
            border-bottom: 1px solid #eee;
            color: #222;
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: #f0f0f0;
            padding: 10px 16px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #ddd;
        }
        tbody td { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #fafafa; }

        .stock-ok { color: #2e7d32; font-weight: bold; }
        .stock-zero { color: #c62828; font-weight: bold; }

        /* FILTROS */
        .filtros {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .filtro-group { display: flex; flex-direction: column; gap: 4px; }
        .filtro-group label { font-size: 0.85rem; color: #555; }
        .filtro-group input, .filtro-group select {
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
            min-width: 180px;
        }
        .btn-filtrar { background: #2e7d32; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .btn-filtrar:hover { background: #1b5e20; }

        /* FORM */
        .form-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 30px;
            max-width: 700px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: #444; }
        .form-group select, .form-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .form-group select:focus, .form-group input:focus {
            outline: none;
            border-color: #1a3a6e;
        }
        .form-actions { display: flex; gap: 10px; margin-top: 24px; }

        .badge-entrada { background: #e8f5e9; color: #2e7d32; padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .badge-salida { background: #ffebee; color: #c62828; padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-inner">
        <a href="/" class="navbar-brand">Sistema de Inventario de Bodega</a>
        <div class="navbar-nav">
            <a href="/" class="{% block nav_resumen %}{% endblock %}">Resumen</a>
            <a href="/productos/" class="{% block nav_productos %}{% endblock %}">Productos</a>
            <a href="/movimientos/" class="{% block nav_movimientos %}{% endblock %}">Movimientos</a>
            <a href="/admin/" class="">Admin</a>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
